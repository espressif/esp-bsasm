# Publishes esp-bsasm to PyPI from the GitHub mirror, using PyPI trusted
# publishing (OIDC): no credentials are stored anywhere. The repository,
# workflow name and environment below must match the "pending publisher"
# configured on pypi.org (Account settings -> Publishing).
#
# Flow: push a v* tag from GitLab (the GitLab EE push mirror carries it
# here) -> create and publish a GitHub release for the tag -> this
# workflow builds the distributions and uploads them.
name: PyPI release

on:
  release:
    types: [released]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Validate wheel installation
        run: |
          python -m venv /tmp/esp-bsasm-check
          /tmp/esp-bsasm-check/bin/python -m pip install --upgrade pip
          /tmp/esp-bsasm-check/bin/python -m pip install dist/*.whl
          /tmp/esp-bsasm-check/bin/bsasm --help
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/esp-bsasm
    permissions:
      id-token: write  # mandatory for PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
