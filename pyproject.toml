[build-system]
# 77.0.3 is the first setuptools release that supports PEP 639 license
# expressions (`license = "<SPDX>"` and `license-files`).
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-bsasm"
dynamic = ["version"]
description = "Assembler for the Espressif BitScrambler instruction set"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Espressif Systems (Shanghai) CO LTD", email = "espressif@espressif.com" },
]
keywords = ["esp32", "espressif", "bitscrambler", "assembler"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Environment :: Console",
  "Topic :: Software Development :: Embedded Systems",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
]
# The generated parser sources import the antlr4 runtime at run time
# (`from antlr4 import *`), and a runtime of at least the generating
# tool's version is required - hence the floor, not a lock.
dependencies = [
  "antlr4-python3-runtime>=4.13.2",
  # The shared logger / errors / excepthook APIs require this floor.
  "esp-pylib>=1.2.1",
  "rich-click",
]

[project.optional-dependencies]
dev = [
  "czespressif",
]
test = [
  "pytest>=9",
  "pytest-cov>=7",
  # test_lsp.py exercises the language server, so its runtime deps are
  # part of the test environment too.
  "pygls>=2.1",
  "lsprotocol",
]
lsp = [
  "pygls>=2.1",
  "lsprotocol",
]

[project.scripts]
bsasm = "bsasm.cli:run"
bsasm-lsp = "bsasm.lsp:main"

[project.urls]
Repository = "https://github.com/espressif/esp-bsasm"
"Source Code" = "https://github.com/espressif/esp-bsasm"
Documentation = "https://docs.espressif.com/projects/esp-idf/en/latest/esp32c5/api-reference/peripherals/bitscrambler.html"

[tool.setuptools.dynamic]
version = { attr = "bsasm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bsasm*"]

[tool.commitizen]
name = "czespressif"
version = "0.1.0"
tag_format = "v$version"
bump_message = "change(bump): Update version to $new_version"
version_files = [
  "src/bsasm/__init__.py",
  "editors/vscode/package.json:version",
]

# The ruff and mypy settings live here (repository-templates/python-project).
[tool.ruff]
line-length = 120
target-version = "py311"
force-exclude = true
extend-exclude = ["src/bsasm/generated"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# F: Pyflakes, E/W: pycodestyle, I: isort, UP: pyupgrade
select = ["F", "E", "W", "I", "UP"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["bsasm"]
known-local-folder = ["bsbin"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_no_return = true
warn_unused_configs = true
# tests/bsbin.py is imported as a top-level module (pytest puts tests/ on sys.path).
mypy_path = "tests"
# The generated modules star-import the antlr4 runtime, and the pre-commit
# environment does not install package dependencies; resolve those names as
# Any instead of failing.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The generated modules do `from antlr4 import *`; without the runtime
# installed their names cannot be resolved, so opt the machine output out
# of error reporting entirely.
module = ["bsasm.generated.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  # Third-party code may lag the newest CPython deprecations (the coverage
  # job runs on the newest Python release); those warnings come from
  # dependencies this repository does not own.
  "ignore::DeprecationWarning:esp_pylib",
  "ignore::DeprecationWarning:rich",
  "ignore::DeprecationWarning:pygments",
  "ignore::DeprecationWarning:antlr4",
  # pygls 2.1 calls the deprecated asyncio.iscoroutinefunction while
  # registering features (Python 3.14+); fixed upstream, ignore until then.
  "ignore::DeprecationWarning:pygls.feature_manager",
]
xfail_strict = true
log_cli_level = "INFO"

[tool.coverage.run]
source = ["bsasm"]
branch = true
omit = ["src/bsasm/generated/*"]

[tool.coverage.report]
omit = ["src/bsasm/generated/*"]
exclude_also = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
show_missing = true

[tool.codespell]
skip = "src/bsasm/generated,tests/testcases,vendor,*.jar"
